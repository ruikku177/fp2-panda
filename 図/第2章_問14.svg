  <title id="title">第2章 問14 収入保障保険の年金受取総額の模式図</title>
  <desc id="desc">2020年6月1日契約、2027年6月1日が35歳、2045年6月1日が53歳。死亡時期が遅くなるほど年金受取総額は小さくなり、最後の5年間は保証期間分の高さで一定。</desc>
