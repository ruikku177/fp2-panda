<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
  <title id="title">第1章 問35 高額療養費算定の模式図</title>
  <desc id="desc">1か月当たりの総医療費は、協会けんぽ負担と窓口の自己負担に分かれる。窓口の自己負担から高額療養費を差し引いた部分が自己負担限度額となる。</desc>
  <style>text{font-family:'Yu Gothic','Noto Sans JP',sans-serif;fill:#172633} .hd{font-size:22px;font-weight:700}.lab{font-size:19px}.box{stroke:#385473;stroke-width:2}.line{stroke:#385473;stroke-width:2}</style>
  <rect width="1000" height="250" fill="#f8fafc"/>
  <text class="hd" x="20" y="34">本年3月分の高額療養費の算定</text>
  <text class="lab" x="620" y="70">窓口での自己負担分</text><path class="line" d="M570 77 H980"/>
  <rect class="box" x="20" y="90" width="550" height="70" fill="#e6f0fa"/>
  <rect class="box" x="570" y="90" width="190" height="70" fill="#cbdff1"/>
  <rect class="box" x="760" y="90" width="220" height="70" fill="#fff3d9"/>
  <text class="lab" x="112" y="131">協会けんぽが負担（療養の給付）</text>
  <text class="lab" x="602" y="131">高額療養費</text>
  <text class="lab" x="783" y="131">自己負担限度額</text>
  <path class="line" d="M20 178 H980"/><path class="line" d="M20 171 v14 M980 171 v14"/>
  <text class="lab" x="300" y="209">1か月当たりの総医療費（保険診療分）</text>
</svg>
