<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">証券口座の概要</title>
<desc id="desc">個人投資家から一般口座a、特定口座、NISA口座dへ分岐。特定口座は源泉徴収なしの簡易申告口座bと源泉徴収ありの源泉徴収選択口座cへ分岐する。</desc>
<rect width="900" height="390" fill="white"/>
<g fill="none" stroke="#222" stroke-width="2"><path d="M180 195H230V65H280 M230 195H280 M230 195V325H280 M430 195H470V145H510 M470 195V245H510"/>
<rect x="20" y="170" width="160" height="50"/><rect x="280" y="40" width="150" height="50"/><rect x="280" y="170" width="150" height="50"/>
<rect x="510" y="110" width="300" height="70"/><rect x="510" y="210" width="300" height="70"/><rect x="280" y="300" width="530" height="50"/></g>
<g fill="#111" font-family="sans-serif" font-size="21" text-anchor="middle">
<text x="100" y="202">個人投資家</text><text x="355" y="72">一般口座</text><text x="355" y="202">特定口座</text>
<text x="660" y="140">源泉徴収なし</text><text x="660" y="166">（簡易申告口座）</text>
<text x="660" y="240">源泉徴収あり</text><text x="660" y="266">（源泉徴収選択口座）</text>
<text x="545" y="332">NISA（少額投資非課税制度）口座</text>
<text x="480" y="72">…(a)</text><text x="855" y="152">…(b)</text><text x="855" y="252">…(c)</text><text x="855" y="332">…(d)</text></g></svg>
