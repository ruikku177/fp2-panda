<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 490" role="img" aria-labelledby="title desc">
  <title id="title">第6章 問53 土地図</title>
  <desc id="desc">路線価400Dの道路に面する間口16メートル、奥行20メートル、面積320平方メートルの土地。奥行補正率1.00、借地権割合60パーセント、借家権割合30パーセント。土地所有者所有の賃貸マンションがあり全戸賃貸中。</desc>
  <rect width="1300" height="490" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="square">
    <path d="M80 48H510 M80 106H510"/>
    <path d="M110 106V329H410V106"/>
    <path d="M95 111v210 M95 111l-12 24 M95 111l12 24 M95 321l-12-24 M95 321l12-24"/>
    <path d="M110 349H410 M110 349l22-10 M110 349l22 10 M410 349l-22-10 M410 349l-22 10"/>
    <path d="M100 75H490 M100 75l18-9 M100 75l18 9 M490 75l-18-9 M490 75l-18 9"/>
  </g>
  <g fill="#111" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="24">
    <rect x="245" y="58" width="100" height="36" fill="white"/>
    <text x="295" y="89" text-anchor="middle">400D</text>
    <text x="255" y="224" text-anchor="middle">320㎡</text>
    <text x="72" y="222" text-anchor="middle" transform="rotate(-90 72 222)">20m</text>
    <text x="260" y="384" text-anchor="middle">16m</text>
    <text x="550" y="150">注1：奥行価格補正率 1.00</text>
    <text x="550" y="192">注2：借地権割合 60%</text>
    <text x="550" y="234">注3：借家権割合 30%</text>
    <text x="550" y="280">注4：この宅地には宅地所有者の所有する</text>
    <text x="550" y="312">賃貸マンションが建っており、現在すべて賃貸中。</text>
    <text x="550" y="365">注5：その他の記載のない条件は一切考慮しないものとする。</text>
  </g>
</svg>
