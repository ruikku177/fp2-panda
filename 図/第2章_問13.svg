<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc">
  <title id="title">第2章 問13 解約返戻金相当額の推移・選択肢1から4</title>
  <desc id="desc">原本の4つの模式図を読みやすいベクター図として再作図。1は払込期間中に低い山を描いて満期でゼロ、2は払込満了まで滑らかに上昇、3は払込満了時に段差を伴い上昇、4は満期まで上昇する。</desc>
  <style>text{font-family:'Yu Gothic','Noto Sans JP',sans-serif;fill:#17202c} .panel{fill:#fff;stroke:#bbc7d5;stroke-width:1.5} .frame{fill:none;stroke:#303a46;stroke-width:2.5} .axis{stroke:#303a46;stroke-width:2.5} .shade{fill:#cbd8e8;stroke:#244975;stroke-width:2.5} .dash{stroke:#61758e;stroke-width:1.8;stroke-dasharray:7 5} .n{font-size:24px;font-weight:700} .lab{font-size:16px} .small{font-size:14px} .arr{fill:#303a46}</style>
  <rect width="1000" height="710" fill="#f8fafc"/>
  <g transform="translate(25 20)">
    <rect class="panel" width="460" height="325" rx="10"/><text class="n" x="18" y="36">1</text>
    <path class="frame" d="M45 65 H390 V245 H45 Z"/><path class="shade" d="M45 245 C130 242 200 218 250 219 C305 220 350 238 390 245 Z"/>
    <text class="lab" x="126" y="142">解約返戻金相当額</text><path class="axis" d="M245 150 V210"/><path class="arr" d="M240 206 L250 206 245 215 Z"/>
    <text class="small" x="30" y="270">契約</text><text class="small" x="366" y="270">満期</text><text class="small" x="140" y="300">保険料払込期間</text>
    <text class="lab" x="401" y="118" writing-mode="tb">死亡保険金</text>
  </g>
  <g transform="translate(515 20)">
    <rect class="panel" width="460" height="325" rx="10"/><text class="n" x="18" y="36">2</text>
    <path class="frame" d="M45 65 H348 L390 160 348 245 H45 Z"/><path class="shade" d="M45 245 C135 228 180 202 235 136 C277 91 310 85 348 78 L390 160 348 245 Z"/>
    <path class="dash" d="M235 136 V245"/><text class="lab" x="125" y="91">解約返戻金相当額</text><path class="axis" d="M265 97 L253 123"/><path class="arr" d="M249 119 L260 124 251 130 Z"/>
    <text class="small" x="30" y="270">契約</text><text class="small" x="203" y="270">払込満了</text><text class="small" x="90" y="300">保険料払込期間</text>
    <text class="lab" x="11" y="96" writing-mode="tb">死亡保険金</text>
  </g>
  <g transform="translate(25 365)">
    <rect class="panel" width="460" height="325" rx="10"/><text class="n" x="18" y="36">3</text>
    <path class="frame" d="M45 65 H348 L390 160 348 245 H45 Z"/><path class="shade" d="M45 245 C105 230 172 200 235 166 L235 128 C272 96 313 82 348 78 L390 160 348 245 Z"/>
    <path class="dash" d="M235 65 V245"/><text class="lab" x="84" y="95">解約返戻金相当額</text><path class="axis" d="M198 103 L227 157"/><path class="arr" d="M220 155 L232 162 229 149 Z"/>
    <text class="small" x="30" y="270">契約</text><text class="small" x="203" y="270">払込満了</text><text class="small" x="90" y="300">保険料払込期間</text>
    <text class="lab" x="11" y="96" writing-mode="tb">死亡保険金</text>
  </g>
  <g transform="translate(515 365)">
    <rect class="panel" width="460" height="325" rx="10"/><text class="n" x="18" y="36">4</text>
    <path class="frame" d="M45 65 H348 V245 H45 Z"/><path class="shade" d="M45 245 C135 229 216 185 276 138 C310 109 330 79 348 65 L348 245 Z"/>
    <text class="lab" x="94" y="122">解約返戻金相当額</text><path class="axis" d="M218 128 L253 163"/><path class="arr" d="M245 162 L258 168 253 155 Z"/>
    <text class="small" x="30" y="270">契約</text><text class="small" x="326" y="270">満期</text><text class="small" x="130" y="300">保険料払込期間</text>
    <text class="lab" x="410" y="76" writing-mode="tb">死亡保険金</text><text class="small" x="379" y="76" writing-mode="tb">満期保険金</text>
  </g>
